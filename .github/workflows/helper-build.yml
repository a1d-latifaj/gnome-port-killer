name: Helper Build

on:
  push:
    branches:
      - feat/ubuntu-public-installer
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-x86_64:
    name: Ubuntu 24.04 / x86_64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            linux-tools-common \
            libelf-dev \
            zlib1g-dev

      - name: Check kernel BTF
        run: |
          test -r /sys/kernel/btf/vmlinux
          uname -r
          bpftool version
          clang --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build helper
        run: |
          cargo build \
            --manifest-path helper/Cargo.toml \
            --release \
            --locked

      - name: Verify ELF architecture
        run: |
          file helper/target/release/port-killer-events
          readelf -h helper/target/release/port-killer-events
          ldd helper/target/release/port-killer-events

      - name: Verify Ubuntu 24.04 GLIBC compatibility
        run: |
          python3 scripts/check-glibc.py \
            helper/target/release/port-killer-events \
            --max-version 2.39

      - name: Test GLIBC validator
        run: python3 tests/test-glibc.py

      - name: Package helper
        run: |
          mkdir -p dist

          install -m 0755 \
            helper/target/release/port-killer-events \
            dist/port-killer-events-linux-x86_64

          (
            cd dist
            sha256sum port-killer-events-linux-x86_64 > SHA256SUMS
          )

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: port-killer-events-linux-x86_64
          path: dist/
          if-no-files-found: error
