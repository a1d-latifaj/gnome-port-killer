name: Helper Draft Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (example: v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: helper-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build-verify:
    name: Build and verify Ubuntu 24.04 / x86_64
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Validate release request
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || exit 1

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Validate version and tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          PACKAGE_VERSION="$(
            cargo metadata \
              --manifest-path helper/Cargo.toml \
              --no-deps \
              --format-version 1 |
            python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"] == "port-killer-events"))'
          )"

          [[ "$RELEASE_VERSION" == "v$PACKAGE_VERSION" ]] || exit 1
          [[ "$GITHUB_SHA" == "$(git rev-parse origin/main)" ]] || exit 1

          git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION" || exit 1
          [[ "$(git rev-list -n 1 "refs/tags/$RELEASE_VERSION")" == "$GITHUB_SHA" ]] || exit 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang llvm linux-tools-common \
            libelf-dev zlib1g-dev

      - name: Check kernel BTF
        run: |
          test -r /sys/kernel/btf/vmlinux
          bpftool version

      - name: Build helper
        run: |
          cargo build \
            --manifest-path helper/Cargo.toml \
            --release \
            --locked

      - name: Validate helper
        run: |
          python3 scripts/check-helper-elf.py \
            helper/target/release/port-killer-events

          python3 scripts/check-glibc.py \
            helper/target/release/port-killer-events \
            --max-version 2.39

          python3 tests/test-helper-elf.py
          python3 tests/test-glibc.py

      - name: Package helper
        run: |
          mkdir -p dist
          install -m 0755 \
            helper/target/release/port-killer-events \
            dist/port-killer-events-linux-x86_64

          (
            cd dist
            sha256sum port-killer-events-linux-x86_64 > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Upload verified artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: helper-release-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  draft-release:
    name: Create draft release
    needs: build-verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Validate release context
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || exit 1
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag matches commit
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$GITHUB_SHA" == "$(git rev-parse origin/main)" ]] || exit 1
          git show-ref --verify --quiet "refs/tags/$RELEASE_VERSION" || exit 1
          [[ "$(git rev-list -n 1 "refs/tags/$RELEASE_VERSION")" == "$GITHUB_SHA" ]] || exit 1

      - name: Download verified artifact
        uses: actions/download-artifact@v8.0.2
        with:
          name: helper-release-${{ github.sha }}
          path: dist/

      - name: Verify downloaded artifact
        run: |
          (
            cd dist
            sha256sum --check SHA256SUMS
          )
          python3 scripts/check-helper-elf.py \
            dist/port-killer-events-linux-x86_64
          python3 scripts/check-glibc.py \
            dist/port-killer-events-linux-x86_64 \
            --max-version 2.39

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "$RELEASE_VERSION" \
            dist/port-killer-events-linux-x86_64 \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "GNOME Port Killer $RELEASE_VERSION" \
            --notes "Draft release for Ubuntu 24.04 / x86_64. Requires approval before publication." \
            --draft
